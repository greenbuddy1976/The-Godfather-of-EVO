name: Clean-Room Development Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.configuration-cache=false

    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Clean-room and forbidden-file gate
        run: bash ci/clean_room_check.sh .

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Run Mustang BETA unit tests and assemble unsigned BETA
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache \
            clean testBetaUnitTest assembleBeta
          mapfile -t beta_apks < <(find app/build/outputs/apk/beta -maxdepth 1 \
            -type f -name '*.apk' -size +0c)
          test "${#beta_apks[@]}" -eq 1

      - name: Compile protected release instrumentation contracts
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache \
            compileReleaseAndroidTestJavaWithJavac

      - name: Android BETA lint
        id: android_lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache lintBeta

      - name: Print and enforce warning-free lint report
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.android_lint.outcome }}
        run: |
          set -euo pipefail
          report=app/build/reports/lint-results.txt
          test -f "$report"
          cat "$report"
          test "$LINT_OUTCOME" = success
          ! grep -Eq '(^|[[:space:]])Warning:' "$report"

      - name: Confirm no setup payload or text-export MIME
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t beta_apks < <(find app/build/outputs/apk/beta -maxdepth 1 \
            -type f -name '*.apk' -size +0c)
          test "${#beta_apks[@]}" -eq 1
          if unzip -l "${beta_apks[0]}" \
              | grep -Eiq '\.carsetup$|backup|emergency|fallback'; then
            echo 'Forbidden setup/fallback payload found in BETA package'
            exit 1
          fi
          if grep -RInE 'text/plain|\.txt' app/src/main; then
            echo 'Forbidden text export found in production source'
            exit 1
          fi

      - name: Name unsigned Mustang BETA artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t beta_apks < <(find app/build/outputs/apk/beta -maxdepth 1 \
            -type f -name '*.apk' -size +0c)
          test "${#beta_apks[@]}" -eq 1
          cp "${beta_apks[0]}" \
            The-Godfather-of-EVO-1.1.1-Mustang-BETA-unsigned.apk

      - name: Upload unsigned Mustang BETA APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Godfather-of-EVO-1.1.1-Mustang-BETA-unsigned
          path: The-Godfather-of-EVO-1.1.1-Mustang-BETA-unsigned.apk
          if-no-files-found: error
          retention-days: 14
