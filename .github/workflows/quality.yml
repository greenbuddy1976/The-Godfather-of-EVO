name: Clean-Room Development Quality

on:
  push:
    branches:
      - 'agent/cleanroom-v1.1.1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.configuration-cache=false

    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Clean-room and forbidden-file gate
        run: bash ci/clean_room_check.sh .

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Compile, run 12,425 safety matrix and assemble debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache \
            clean testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Compile protected release instrumentation contracts
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache \
            compileReleaseAndroidTestJavaWithJavac

      - name: Android lint
        id: android_lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --no-configuration-cache lintDebug

      - name: Print and enforce warning-free lint report
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.android_lint.outcome }}
        run: |
          set -euo pipefail
          report=app/build/reports/lint-results.txt
          test -f "$report"
          cat "$report"
          test "$LINT_OUTCOME" = success
          ! grep -Eq '(^|[[:space:]])Warning:' "$report"

      - name: Confirm no setup payload or text-export MIME
        shell: bash
        run: |
          set -euo pipefail
          if unzip -l app/build/outputs/apk/debug/app-debug.apk \
              | grep -Eiq '\.carsetup$|backup|emergency|fallback'; then
            echo 'Forbidden setup/fallback payload found in debug package'
            exit 1
          fi
          if grep -RInE 'text/plain|\.txt' app/src/main; then
            echo 'Forbidden text export found in production source'
            exit 1
          fi
