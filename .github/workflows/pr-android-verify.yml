name: Android PR Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'freshapp/**'
      - '.github/workflows/fresh-live-android.yml'
      - '.github/workflows/pr-android-verify.yml'

permissions:
  contents: read

jobs:
  verify-freshapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.13 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Configure Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and lint
        shell: bash
        run: gradle -p freshapp --no-daemon --no-build-cache clean testDebugUnitTest lintDebug

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p freshapp --no-daemon --no-build-cache assembleDebug
          test -s freshapp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PR test APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-apk
          path: freshapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
