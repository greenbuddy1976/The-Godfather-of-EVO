name: Cleanroom Android 1.1.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      REPORT_ROOT: ${{ github.workspace }}/release-reports

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify independent 1.1.1 contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(find cleanroom/app/src/main -type f -name '*.carsetup' | wc -l)" -eq 0
          grep -q "versionName '1.1.1'" cleanroom/app/build.gradle
          grep -q "versionCode 4" cleanroom/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re
          catalog = Path('cleanroom/app/src/main/java/com/greenbuddy/acevosetupengineer/Catalog.java').read_text()
          cars = re.search(r'CARS = \{(.*?)\n    \};', catalog, re.S).group(1)
          tracks = re.search(r'TRACKS = \{(.*?)\n    \};', catalog, re.S).group(1)
          ui = Path('cleanroom/app/src/main/java/com/greenbuddy/acevosetupengineer/MainActivity.java').read_text()
          assert len(re.findall(r'^\s*".*",?$', cars, re.M)) == 71
          assert len(re.findall(r'"[^"]+"', tracks)) == 24
          assert ui.count('{"') == 8
          PY
          ! grep -RniE '#D71920|Color\.RED' cleanroom/app/src/main
          mkdir -p "$REPORT_ROOT"
          printf '%s\n' 'version=1.1.1' 'cars=71' 'tracks=24' 'modes=5' 'fine_tune_groups=8' \
            'bundled_carsetup_files=0' > "$REPORT_ROOT/contract.txt"

      - name: Configure Gradle 8.13 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Configure Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install pinned Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run tests and lint
        shell: bash
        run: |
          set -euo pipefail
          gradle -p cleanroom --no-daemon --no-build-cache clean testDebugUnitTest lintRelease

      - name: Build release candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle -p cleanroom --no-daemon --no-build-cache assembleRelease
          APK="cleanroom/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          mkdir -p "$REPORT_ROOT/apk" "$REPORT_ROOT/tests" "$REPORT_ROOT/lint"
          cp "$APK" "$REPORT_ROOT/apk/The-Godfather-of-EVO-1.1.1-unsigned.apk"
          cp -R cleanroom/app/build/test-results/testDebugUnitTest/. "$REPORT_ROOT/tests/"
          cp cleanroom/app/build/reports/lint-results-release.html "$REPORT_ROOT/lint/"
          sha256sum "$REPORT_ROOT/apk/The-Godfather-of-EVO-1.1.1-unsigned.apk" > "$REPORT_ROOT/SHA256SUMS.txt"

      - name: Upload verified unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: The-Godfather-of-EVO-1.1.1-cleanroom
          path: release-reports/
          if-no-files-found: error
          retention-days: 30
