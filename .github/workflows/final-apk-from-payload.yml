name: Build FINAL APK exact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Reconstruct and verify exact FINAL source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/final.b64
          cat ci/final.part00.txt >> /tmp/final.b64
          cat ci/final.part00a.txt >> /tmp/final.b64
          cat ci/final.part00b0.txt >> /tmp/final.b64
          cat ci/final.part00b1.txt >> /tmp/final.b64
          cat ci/final.part00b2.txt >> /tmp/final.b64
          cat ci/final.part00b3.txt >> /tmp/final.b64
          cat .finalbuild/c1.txt >> /tmp/final.b64
          cat .build-payload/chunk_02.b64 >> /tmp/final.b64
          cat .build-payload/chunk_03.b64 >> /tmp/final.b64
          cat .finalpayload/part04.b64 >> /tmp/final.b64
          cat .finalpayload/part05.b64 >> /tmp/final.b64
          cat .final-payload/p6.b64 >> /tmp/final.b64
          test "$(wc -c < /tmp/final.b64)" -eq 102320
          base64 -d /tmp/final.b64 > /tmp/final.zip
          echo "a0af63422471b3d2a595a1a11f6c1b3eb97a7962ba9174599687402b4ba7dc8b  /tmp/final.zip" | sha256sum -c -
          unzip -t /tmp/final.zip
          rm -rf finalapp
          mkdir finalapp
          unzip -q /tmp/final.zip -d finalapp

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x finalapp/gradlew
          cd finalapp
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../The_Godfather_of_EVO_FINAL_v1.8.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The_Godfather_of_EVO_FINAL_v1.8.0
          path: The_Godfather_of_EVO_FINAL_v1.8.0.apk
          if-no-files-found: error
          retention-days: 30
