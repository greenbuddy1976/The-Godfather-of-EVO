name: Build FINAL APK exact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify exact FINAL source
        shell: bash
        run: |
          set -euo pipefail
          echo "a0af63422471b3d2a595a1a11f6c1b3eb97a7962ba9174599687402b4ba7dc8b  exact_payload.zip" | sha256sum -c -
          unzip -t exact_payload.zip
          rm -rf finalapp
          mkdir finalapp
          unzip -q exact_payload.zip -d finalapp

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x finalapp/gradlew
          cd finalapp
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../The_Godfather_of_EVO_FINAL_v1.8.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The_Godfather_of_EVO_FINAL_v1.8.0
          path: The_Godfather_of_EVO_FINAL_v1.8.0.apk
          if-no-files-found: error
          retention-days: 30
