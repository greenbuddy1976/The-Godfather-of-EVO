name: AC EVO Setup Engineer 2.1.0

on:
  push:
    branches:
      - main
      - 'agent/setup-engine-2.1.0'
    paths:
      - 'freshapp/**'
      - '.github/workflows/fresh-live-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 2.1.0 setup-generator contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(find freshapp/app/src/main -type f -name '*.carsetup' | wc -l)" -eq 0
          ! grep -Rni 'SharedPreferences' freshapp/app/src/main
          ! grep -RniE 'text/plain|\.txt"' freshapp/app/src/main
          grep -q 'application/octet-stream' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'ACTION_CREATE_DOCUMENT' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'runTwoRounds' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'SetupEngine.Profile.values()' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'BinarySetupEditor.apply' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'STABLE_FAST' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/SetupEngine.java
          grep -q 'set(out, "5.1", 1f' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/SetupEngine.java
          grep -q 'Catalog.CARS' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'Catalog.TRACKS' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/MainActivity.java
          grep -q 'SETUPSMARKET' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/LiveSetupSearch.java
          grep -q 'RACEPLACE' freshapp/app/src/main/java/com/greenbuddy/godfatherlive/LiveSetupSearch.java
          grep -q "versionName '2.1.0'" freshapp/app/build.gradle
          grep -q 'versionCode 21' freshapp/app/build.gradle

      - name: Configure Gradle 8.13 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Configure Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and lint
        shell: bash
        run: gradle -p freshapp --no-daemon --no-build-cache clean testDebugUnitTest lintDebug

      - name: Build installable APK and verification bundle
        shell: bash
        run: |
          set -euo pipefail
          gradle -p freshapp --no-daemon --no-build-cache assembleDebug
          apk="freshapp/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-2.1.0/tests release-2.1.0/lint
          cp "$apk" release-2.1.0/The-Godfather-of-EVO-Setup-Engineer-2.1.0.apk
          cp -R freshapp/app/build/test-results/testDebugUnitTest/. release-2.1.0/tests/
          cp freshapp/app/build/reports/lint-results-debug.html release-2.1.0/lint/
          sha256sum release-2.1.0/The-Godfather-of-EVO-Setup-Engineer-2.1.0.apk > release-2.1.0/SHA256SUMS.txt
          printf '%s\n' \
            'app_id=com.greenbuddy.godfatherlive' \
            'version=2.1.0' \
            'profiles=5' \
            'live_search=two_rounds_per_request' \
            'fallback=same_car_verified_binary_structure' \
            'binary_writer=float32_verified_paths_only' \
            'mustang_stable_fast_tc1=1' \
            'export=carsetup_binary_only' \
            'persistent_setup_cache=none' > release-2.1.0/VERIFICATION.txt

      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Godfather-of-EVO-Setup-Engineer-2.1.0
          path: release-2.1.0/
          if-no-files-found: error
          retention-days: 30
