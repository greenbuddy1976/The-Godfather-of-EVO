plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('ACEVO_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ACEVO_KEYSTORE_PASSWORD')

android {
    namespace 'com.greenbuddy.acevosetupengineer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greenbuddy.acevosetupengineer'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.1'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'acevosetup'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
