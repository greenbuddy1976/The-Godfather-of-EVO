plugins { id 'com.android.application' }

android {
    namespace 'com.greenbuddy.godfatherlive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greenbuddy.godfatherlive'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
