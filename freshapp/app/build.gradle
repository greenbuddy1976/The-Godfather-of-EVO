plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('ACEVO_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ACEVO_KEYSTORE_PASSWORD')

android {
    namespace 'com.greenbuddy.godfatherlive'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greenbuddy.godfatherlive'
        minSdk 26
        targetSdk 35
        versionCode 22
        versionName '2.1.1'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'acevosetup'
                keyPassword releaseKeystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystorePath != null && releaseKeystorePassword != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('applySymptomFineTune', Exec) {
    workingDir rootDir
    commandLine 'python3', 'symptom_patch.py'
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('applySymptomFineTune')
}

dependencies { testImplementation 'junit:junit:4.13.2' }
